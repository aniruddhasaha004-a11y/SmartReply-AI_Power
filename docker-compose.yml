version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: smartreply-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - smartreply-network

  # Spring Boot Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartreply-backend
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/smartreply
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLXNtYXJ0cmVwbHktYXBwbGljYXRpb24td2hpY2gtaXMtdXNlZC1mb3Itand0LXNpZ25pbmc=}
      - FRONTEND_URL=${FRONTEND_URL:http://localhost:5173}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:local}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:us-east-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
    depends_on:
      - mongodb
    networks:
      - smartreply-network
    volumes:
      - local-uploads:/app/storage-uploads

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartreply-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - smartreply-network

volumes:
  mongo-data:
  local-uploads:

networks:
  smartreply-network:
    driver: bridge
